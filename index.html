        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;

        /* Subtle background glow for fallback */
        .bg-glow {
            background-image: radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.08) 0%, transparent 60%);
        }
    
        @keyframes scannerSweep { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(350px); opacity: 0; } }
        @keyframes radarRotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes typeWriter { 0% { opacity: 0; transform: translateX(-5px); } 100% { opacity: 1; transform: translateX(0); } }

        @keyframes drawLineSvg { to { stroke-dashoffset: 0; } }
        @keyframes hudPopIn { 0% { transform: scale(0.9) translateY(10px); opacity: 0; filter: blur(4px); } 100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); } }
        @keyframes targetPing { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .hud-line { stroke-dasharray: 800; stroke-dashoffset: 800; }
        .hud-line-anim-1 { animation: drawLineSvg 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards; }
        .hud-line-anim-2 { animation: drawLineSvg 1s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards; }
        .hud-line-anim-3 { animation: drawLineSvg 1s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards; }
        .hud-badge-1 { opacity: 0; animation: hudPopIn 0.4s ease-out 1.2s forwards; }
        .hud-badge-2 { opacity: 0; animation: hudPopIn 0.4s ease-out 1.7s forwards; }
        .hud-badge-3 { opacity: 0; animation: hudPopIn 0.4s ease-out 2.2s forwards; }
        .ping-1 { animation: targetPing 1.5s infinite 1.2s; }
        .ping-2 { animation: targetPing 1.5s infinite 1.7s; }
        .ping-3 { animation: targetPing 1.5s infinite 2.2s; }

        @keyframes progressFill { to { width: 100%; } }
        @keyframes pulseOpacity { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
</style>

function FastCanvas() {
    const canvasRef = React.useRef(null);
    React.useEffect(() => {
        const c = canvasRef.current;
        const ctx = c.getContext('2d');
        let t = 0;
        let animationFrameId;
        const render = () => {
            c.width = c.clientWidth;
            c.height = c.clientHeight;
            ctx.clearRect(0,0,c.width,c.height);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let x=0; x<c.width; x+=5) {
                let y = c.height/2 + Math.sin(x*0.05 + t) * 20;
                if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
            t += 0.08;
            animationFrameId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animationFrameId);
    }, []);
    return <canvas ref={canvasRef} className="w-full h-[120px] bg-slate-900 rounded-xl" />;
}

function SmartCanvas() {
    const canvasRef = React.useRef(null);
    React.useEffect(() => {
        const c = canvasRef.current;
        const ctx = c.getContext('2d');
        let r = 0;
        let animationFrameId;
        const render = () => {
            c.width = c.clientWidth;
            c.height = c.clientHeight;
            ctx.clearRect(0,0,c.width,c.height);
            ctx.strokeStyle = '#0284c7';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(c.width/2, c.height/2, r % (c.height/2), 0, Math.PI*2);
            ctx.stroke();
            r += 0.8;
            animationFrameId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animationFrameId);
    }, []);
    return <canvas ref={canvasRef} className="w-full h-[120px] bg-slate-900 rounded-xl" />;
}

function RightCanvas() {
    const canvasRef = React.useRef(null);
    React.useEffect(() => {
        const c = canvasRef.current;
        const ctx = c.getContext('2d');
        let p = 0;
        let animationFrameId;
        const render = () => {
            c.width = c.clientWidth;
            c.height = c.clientHeight;
            ctx.clearRect(0,0,c.width,c.height);
            ctx.fillStyle = '#38bdf8';
            let w = (Math.sin(p) + 1) / 2 * (c.width - 40);
            ctx.fillRect(20, c.height/2 - 6, w, 12);
            p += 0.04;
            animationFrameId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animationFrameId);
    }, []);
    return <canvas ref={canvasRef} className="w-full h-[120px] bg-slate-900 rounded-xl" />;
}



// --- REALISTIC 3D MARITIME DIGITAL TWIN (THREE.JS) ---
function RealisticShip3D({ active }) {
    const mountRef = React.useRef(null);

    React.useEffect(() => {
        if (!mountRef.current || typeof THREE === 'undefined') return;

        const container = mountRef.current;
        const width = container.clientWidth || 440;
        const height = container.clientHeight || 190;

        // SCENE & RENDERER
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a284e, 0.016);

        const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 100);
        camera.position.set(11.5, 6.0, 13.5);
        camera.lookAt(0, 0.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        // VIBRANT SUNLIT MARITIME LIGHTING
        const sun = new THREE.DirectionalLight(0xfffaed, 2.5);
        sun.position.set(14, 18, 11);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.bias = -0.001;
        scene.add(sun);

        const hemi = new THREE.HemisphereLight(0xbae6fd, 0x0284c7, 1.4);
        scene.add(hemi);

        const seaBounce = new THREE.DirectionalLight(0x0284c7, 0.9);
        seaBounce.position.set(-6, -4, -6);
        scene.add(seaBounce);

        const rim = new THREE.DirectionalLight(0x7dd3fc, 1.3);
        rim.position.set(-10, 8, -12);
        scene.add(rim);

        // REALISTIC VIBRANT OCEAN WATER SURFACE WITH ROLLING SWELL
        const waterGeo = new THREE.PlaneGeometry(65, 48, 52, 40);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x0284c7,
            roughness: 0.14,
            metalness: 0.82,
            flatShading: true
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = 0.08;
        water.receiveShadow = true;
        scene.add(water);

        const posAttr = waterGeo.attributes.position;
        const initialZ = [];
        for (let i = 0; i < posAttr.count; i++) {
            initialZ.push(posAttr.getZ(i));
        }

        // SHIP ROOT GROUP
        const ship = new THREE.Group();
        scene.add(ship);

        // 1. LOWER HULL (Anti-fouling Carmine Red)
        const lowerHullMat = new THREE.MeshStandardMaterial({ color: 0x881337, roughness: 0.5, metalness: 0.2 });
        const lowerHull = new THREE.Mesh(new THREE.BoxGeometry(13.6, 0.7, 2.7), lowerHullMat);
        lowerHull.position.set(0, -0.35, 0);
        lowerHull.castShadow = true;
        lowerHull.receiveShadow = true;
        ship.add(lowerHull);

        // Bulbous Bow (Hydrodynamic submarine bulb protruding forward at keel)
        const bulbGeo = new THREE.SphereGeometry(0.55, 16, 16);
        bulbGeo.scale(1.4, 0.8, 0.8);
        const bulb = new THREE.Mesh(bulbGeo, lowerHullMat);
        bulb.position.set(6.8, -0.4, 0);
        ship.add(bulb);

        // 2. BOOT-TOPPING WATERLINE (Crisp White Stripe)
        const stripeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(14.0, 0.14, 2.75), stripeMat);
        stripe.position.set(0, 0.05, 0);
        ship.add(stripe);

        // WATERLINE WHITE FOAM RIBBONS (Real wave contact with the ship)
        const foamMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.9,
            transparent: true,
            opacity: 0.75
        });
        const foamStarboard = new THREE.Mesh(new THREE.PlaneGeometry(15.2, 0.45), foamMat);
        foamStarboard.rotation.x = -Math.PI / 2;
        foamStarboard.position.set(0.6, 0.10, 1.45);
        ship.add(foamStarboard);

        const foamPort = new THREE.Mesh(new THREE.PlaneGeometry(15.2, 0.45), foamMat);
        foamPort.rotation.x = -Math.PI / 2;
        foamPort.position.set(0.6, 0.10, -1.45);
        ship.add(foamPort);

        // Bow Cutwater V-Wake
        const bowWakeGeo = new THREE.BufferGeometry();
        const wakeVertices = new Float32Array([
            8.6, 0.11, 0,    6.5, 0.10, -2.4,   6.5, 0.10, -1.3,
            8.6, 0.11, 0,    6.5, 0.10, 1.3,    6.5, 0.10, 2.4
        ]);
        bowWakeGeo.setAttribute('position', new THREE.BufferAttribute(wakeVertices, 3));
        const bowWake = new THREE.Mesh(bowWakeGeo, foamMat);
        ship.add(bowWake);

        // 3. UPPER HULL (Naval Graphite/Dark Blue)
        const upperHullMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35, metalness: 0.3 });
        const upperHull = new THREE.Mesh(new THREE.BoxGeometry(14.0, 1.1, 2.75), upperHullMat);
        upperHull.position.set(0, 0.65, 0);
        upperHull.castShadow = true;
        upperHull.receiveShadow = true;
        ship.add(upperHull);

        // Authentic Flared Prow Bow (Forward Rake Cutwater)
        const bowGeo = new THREE.BufferGeometry();
        const bowVertices = new Float32Array([
            // Left hull plate
            6.8, 0.05, -1.375,   6.8, 1.2, -1.375,   8.5, 0.25, 0,
            6.8, 1.2, -1.375,    8.7, 1.45, 0,       8.5, 0.25, 0,
            // Right hull plate
            6.8, 0.05, 1.375,    8.5, 0.25, 0,       6.8, 1.2, 1.375,
            6.8, 1.2, 1.375,     8.5, 0.25, 0,       8.7, 1.45, 0,
            // Top Forecastle Deck
            6.8, 1.2, -1.375,    6.8, 1.2, 1.375,    8.7, 1.45, 0,
            // Keel bottom plate
            6.8, 0.05, -1.375,   8.5, 0.25, 0,       6.8, 0.05, 1.375
        ]);
        bowGeo.setAttribute('position', new THREE.BufferAttribute(bowVertices, 3));
        bowGeo.computeVertexNormals();
        const flaredBow = new THREE.Mesh(bowGeo, upperHullMat);
        flaredBow.castShadow = true;
        ship.add(flaredBow);

        // DECK HATCH COAMINGS & CELL GUIDES (Dark Industrial Slate)
        const deckMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
        const deck = new THREE.Mesh(new THREE.BoxGeometry(11.2, 0.1, 2.5), deckMat);
        deck.position.set(0.6, 1.25, 0);
        deck.receiveShadow = true;
        ship.add(deck);

        // Procedural Texture Generator for Corrugated Metal Containers
        const makeContainerTexture = (bgColor, brandText, reefer) => {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 256, 128);

            for (let x = 6; x < 250; x += 12) {
                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                ctx.fillRect(x, 0, 5, 128);
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(x + 5, 0, 3, 128);
            }
            ctx.fillStyle = 'rgba(15,23,42,0.5)';
            ctx.fillRect(0, 0, 16, 18);
            ctx.fillRect(240, 0, 16, 18);
            ctx.fillRect(0, 110, 16, 18);
            ctx.fillRect(240, 110, 16, 18);

            if (brandText) {
                ctx.fillStyle = reefer ? '#0369a1' : 'rgba(255,255,255,0.95)';
                ctx.font = 'bold 24px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(brandText, 128, 64);
            }
            if (reefer) {
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(16, 24, 24, 80);
                ctx.fillStyle = '#0f172a';
                for (let r = 30; r < 95; r += 8) {
                    ctx.fillRect(18, r, 20, 3);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.generateMipmaps = true;
            return texture;
        };

        const brands = [
            { bg: '#0096d6', text: 'MAERSK' },
            { bg: '#eab308', text: 'MSC' },
            { bg: '#059669', text: 'EVERGREEN' },
            { bg: '#ea580c', text: 'HAPAG-LLOYD' },
            { bg: '#1d4ed8', text: 'CMA CGM' },
            { bg: '#db2777', text: 'ONE' },

        });

        // INTERACTIVE MOUSE PARALLAX
        let mouseX = 0;
        let mouseY = 0;
        const onMouseMove = (e) => {
            const rect = container.getBoundingClientRect();
            mouseX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
            mouseY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
        };
        container.addEventListener('mousemove', onMouseMove);

        // ANIMATION LOOP
        let reqId;
        const clock = new THREE.Clock();

        const animate = () => {
            reqId = requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Radar rotation
            radarBar.rotation.y = time * 3.5;

            // Rolling ocean swell & surface ripples
            const positions = waterGeo.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const u = positions.getX(i);
                const v = positions.getY(i);
                const swell = Math.sin(u * 0.38 + time * 2.6) * 0.24 + Math.cos(v * 0.45 + time * 2.0) * 0.18;
                const ripples = Math.sin(u * 1.2 - time * 3.5) * 0.05;
                positions.setZ(i, initialZ[i] + swell + ripples);
            }
            positions.needsUpdate = true;
            waterGeo.computeVertexNormals();

            // Ship natural oceanic heave & roll
            const roll = Math.sin(time * 1.3) * 0.016;
            const pitch = Math.cos(time * 1.0) * 0.008;
            const heave = Math.sin(time * 1.8) * 0.04;

            ship.rotation.z = roll;
            ship.rotation.x = pitch;
            ship.position.y = heave;

            // 6.5s Cycle for Hero Container Lowering
            const cycleDuration = 6.5;
            const cycleT = time % cycleDuration;

            const targetX = targetSlotPos.x;
            const targetZ = targetSlotPos.z;
            const targetLandingY = targetSlotPos.y + 0.36;
            const startY = targetLandingY + 4.2;

            if (cycleT < 2.8) {
                // Lowering Phase
                const progress = cycleT / 2.8;
                const ease = 1 - Math.pow(1 - progress, 3);
                const currentY = startY - ease * (startY - targetLandingY);
                craneGroup.position.set(targetX, currentY + heave, targetZ);

                const pulse = Math.sin(time * 12) > 0 ? 0xf59e0b : 0x78350f;
                ledMat.color.setHex(pulse);
            } else if (cycleT >= 2.8 && cycleT < 5.8) {
                // Landed & Locked Phase
                const recoil = Math.exp(-(cycleT - 2.8) * 3) * Math.sin((cycleT - 2.8) * 10) * 0.08;
                ship.position.y = heave - recoil;

                craneGroup.position.set(targetX, targetLandingY + heave - recoil, targetZ);
                ledMat.color.setHex(0x22c55e);
            } else {
                // Reset / Return Phase
                const resetProg = (cycleT - 5.8) / 0.7;
                craneGroup.position.set(targetX, targetLandingY + resetProg * 4.2 + heave, targetZ);
                ledMat.color.setHex(0x64748b);
            }

            // Camera Smooth Follow + Mouse Parallax
            const targetCamX = 11.5 + mouseX * 1.5;
            const targetCamY = 6.0 - mouseY * 0.8;
            camera.position.x += (targetCamX - camera.position.x) * 0.05;
            camera.position.y += (targetCamY - camera.position.y) * 0.05;
            camera.lookAt(0.5, 1.2, 0);

            renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
            const w = container.clientWidth || 440;
            const h = container.clientHeight || 190;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
            cancelAnimationFrame(reqId);
            window.removeEventListener('resize', handleResize);
            container.removeEventListener('mousemove', onMouseMove);
            if (renderer.domElement && container.contains(renderer.domElement)) {
                container.removeChild(renderer.domElement);
            }
            renderer.dispose();
        };
    }, []);

    return (
        <div 
            ref={mountRef} 
            style={{
                width: '100%', 
                height: '190px', 
                position: 'relative', 
                background: 'linear-gradient(180deg, #051937 0%, #033266 55%, #0284c7 100%)', 
                overflow: 'hidden',
                borderRadius: '16px 16px 0 0',
                borderBottom: '1px solid rgba(255,255,255,0.08)'
            }}
        />
    );
}
