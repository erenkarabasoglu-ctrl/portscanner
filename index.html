                                </span>
                              )}
                            </td>
                            <td className="p-3.5 text-right">
                              <button 
                                onClick={() => { setViewMode('cards'); setSearchQuery(req.id); }}
                                className="px-3 py-1.5 bg-brand hover:bg-blue-600 text-white font-extrabold text-[10px] rounded-lg transition uppercase"
                              >
                                Fiyatla / İncele →
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}

            </div>
          )}

          {/* TAB 2: ACTIVE SHIPMENT HUB & QUICK STATUS CHIPS */}
          {adminTab === 'tracking' && <AdminTrackingPanel trackings={db?.trackings || []} />}

          {/* TAB 3: CARRIER RATE DATABASE */}
          {adminTab === 'rates' && <AdminRatesPanel rates={carrierRates} />}
        </div>
      );
    }

    function AdminQuoteRow({ req, carrierRates }) {
      const [carrier, setCarrier] = useState('MSC');
      const [buyPrice, setBuyPrice] = useState('1800');
      const [markupPercent, setMarkupPercent] = useState(15);
      const [transit, setTransit] = useState('5');
      const [type, setType] = useState('Direkt');
      const [isRec, setIsRec] = useState(true);

      // Auto-suggest matching rate from library
      const matchedRate = carrierRates.find(r => 
        r.origin.toLowerCase() === req.origin.toLowerCase() && 
        r.destination.toLowerCase() === req.destination.toLowerCase()
      );

      const applyTemplate = (r) => {
        setCarrier(r.carrier);
        setBuyPrice(r.buy_price.toString());
        setMarkupPercent(r.default_markup || 15);
        setTransit(r.transit_days.toString());
        setType(r.type || 'Direkt');
      };

      const calculatedBuy = Number(buyPrice) || 0;
      const calculatedProfit = Math.round(calculatedBuy * (Number(markupPercent) / 100));
      const calculatedSellPrice = calculatedBuy + calculatedProfit;

      const handleQuote = async () => {
        if(!calculatedSellPrice) return alert('Lütfen geçerli bir alış fiyatı giriniz!');
        await API.submitQuote(req.id, { 
          carrier, 
          price: calculatedSellPrice, 
          buy_price: calculatedBuy,
          type, 
          transit_days: Number(transit), 
          is_recommended: isRec 
        });
        alert(`Teklif Gönderildi! Otomatik BL Kartı Açıldı. Net Karınız: +$${calculatedProfit}`);
      };

      return (
        <div id={`quote-row-${req.id}`} className="glass-panel p-6 lg:p-8 rounded-3xl flex flex-col lg:flex-row justify-between gap-8 border border-white/10 hover:border-brand/30 transition">
          {/* Müşteri Talep Detayı */}
          <div className="flex-1">
            <div className="flex items-center space-x-3 mb-3">
              <span className="text-xs font-mono font-bold tracking-widest text-sky-400 bg-sky-400/10 px-3 py-1 rounded-full border border-sky-400/20">{req.id}</span>
              <span className="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-bold uppercase tracking-widest flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Tepki Bekliyor
              </span>
            </div>

            <div className="text-3xl font-extrabold text-white mb-2 flex items-center gap-3">
              <span>{req.origin}</span>
              <span className="text-zinc-600">➔</span>
              <span>{req.destination}</span>
            </div>

            <div className="text-sm text-zinc-400 font-medium tracking-wide mb-6">
              Yük Tipi: <strong className="text-white">{req.cargo_type}</strong> • Miktar: <strong className="text-white">{req.amount} MT</strong> • Tarih: {new Date(req.created_at).toLocaleTimeString()}
            </div>

            {/* Otomatik Şablon Önerisi (Hazır Fiyat Varsa) */}
            {matchedRate && (
              <div className="p-4 bg-brand/10 border border-brand/30 rounded-2xl mb-4 flex items-center justify-between">
                <div>
                  <span className="text-xs font-bold text-sky-300 block">✦ Kütüphaneden Eşleşen Şablon Bulundu</span>
                  <span className="text-xs text-zinc-300 font-mono">{matchedRate.carrier} • Alış: ${matchedRate.buy_price} • Marj: %{matchedRate.default_markup}</span>
                </div>
                <button onClick={() => applyTemplate(matchedRate)} className="px-4 py-2 bg-brand text-white font-extrabold text-xs rounded-xl hover:bg-blue-600 transition">
                  Şablonu Uygula
                </button>
              </div>
            )}

            {/* Önceden Verilen Teklifler */}
            {req.quotes?.length > 0 && (
              <div className="pt-4 border-t border-white/10 flex flex-wrap gap-2">
                <span className="text-xs text-zinc-500 font-bold uppercase block w-full mb-1">Verilen Teklifler:</span>
                {req.quotes.map(q => (
                  <div key={q.id} className="text-xs border border-white/10 bg-dark-900/60 px-3 py-1.5 rounded-xl flex items-center gap-3">
                    <span className="text-white font-bold">{q.carrier}</span>
                    <span className="text-sky-400 font-mono font-bold">${q.price}</span>
                    {q.net_profit && <span className="text-emerald-400 font-mono text-[10px] bg-emerald-500/10 px-2 py-0.5 rounded">+$${q.net_profit}</span>}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 🎚️ INTERACTIVE MARGIN SLIDER & HYBRID PRICING FORM */}
          <div className="bg-dark-900/90 p-6 rounded-2xl border border-white/10 lg:w-[480px] flex flex-col justify-between space-y-4">
            <div className="text-xs font-bold text-zinc-400 uppercase tracking-widest flex justify-between border-b border-white/10 pb-2">
              <span>🎚️ Hızlı Marj & Fiyatlama Formu</span>
              <span className="text-emerald-400">Canlı Hesaplayıcı</span>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[10px] text-zinc-400 font-bold uppercase">Armatör Seçimi</label>
                <select value={carrier} onChange={e=>setCarrier(e.target.value)} className="w-full bg-dark-800 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none">
                  <option value="MSC">MSC</option>
                  <option value="MAERSK LINE">MAERSK LINE</option>
                  <option value="CMA CGM">CMA CGM</option>
                  <option value="DFDS Seaways">DFDS Seaways (Ro-Ro)</option>
                  <option value="ARKAS Line">ARKAS Line (Bölgesel)</option>
                  <option value="TURKON Line">TURKON Line (Ekspres)</option>
                  <option value="MEDKON Lines">MEDKON Lines (Kabotaj)</option>
                  <option value="GRIMALDI Lines">GRIMALDI Lines (Ro-Ro/Konteyner)</option>
                  <option value="COSCO">COSCO SHIPPING</option>
                  <option value="HAPAG-LLOYD">HAPAG-LLOYD</option>
                  <option value="ONE">ONE (Ocean Network)</option>
                  <option value="EVERGREEN">EVERGREEN LINE</option>
                </select>
              </div>
              <div>
                <label className="text-[10px] text-zinc-400 font-bold uppercase">Armatör Alış ($ Buy)</label>
                <input type="number" value={buyPrice} onChange={e=>setBuyPrice(e.target.value)} placeholder="Örn: 1800" className="w-full bg-dark-800 border border-white/10 rounded-xl px-3 py-2 text-xs text-white font-mono outline-none" />
              </div>
            </div>

            {/* İnteraktif Marj Slider (Kaydıraç) */}
            <div className="bg-dark-800 p-3.5 rounded-xl border border-white/10 space-y-2">
              <div className="flex justify-between items-center text-xs">
                <span className="font-bold text-zinc-400">Kar Marjı Kaydıraçı:</span>
                <span className="font-mono font-extrabold text-sky-400 bg-sky-400/10 px-2 py-0.5 rounded">% {markupPercent}</span>
              </div>
              <input 
                type="range" 
                min="5" 
                max="35" 
                step="1" 
                value={markupPercent} 
                onChange={e=>setMarkupPercent(Number(e.target.value))}
                className="w-full accent-brand cursor-pointer"
              />
              <div className="flex justify-between text-[9px] text-zinc-500 font-mono">
                <span>%5 (Minimum)</span>
                <span>%15 (Standart)</span>
                <span>%35 (VIP)</span>
              </div>
            </div>

            {/* Anlık Hesaplanan Satış Fiyatı ve Net Kar Göstergesi */}
            <div className="grid grid-cols-2 gap-3 p-3 bg-dark-800 rounded-xl border border-white/10 text-center">
              <div>
                <div className="text-[10px] text-zinc-400 uppercase font-bold">Müşteri Satış Fiyatı</div>
                <div className="text-xl font-extrabold text-white font-mono mt-0.5">${calculatedSellPrice}</div>
              </div>
              <div className="border-l border-white/10">
                <div className="text-[10px] text-emerald-400 uppercase font-bold">Net Şirket Karı</div>
                <div className="text-xl font-extrabold text-emerald-400 font-mono mt-0.5">+$${calculatedProfit}</div>
              </div>
            </div>

            <button onClick={handleQuote} className="w-full py-3.5 bg-white hover:bg-zinc-200 text-black text-xs font-extrabold rounded-xl transition uppercase tracking-widest shadow-lg shadow-white/10">
              TEKLİFİ ONAYLA VE GÖNDER ⚡
            </button>
          </div>
        </div>
      );
    }

    function AdminTrackingPanel({ trackings }) {
      const [newTrackNo, setNewTrackNo] = useState('');
      const [newCarrier, setNewCarrier] = useState('CMA CGM');

      const handleCreate = async () => {
        if(!newTrackNo) return alert('Konşimento numarası giriniz!');
        await API.createTracking({ tracking_no: newTrackNo, carrier: newCarrier });
        setNewTrackNo(''); alert('Yeni Sevkiyat Oluşturuldu!');
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-6 rounded-3xl flex items-end gap-4 border border-white/10">
            <div className="flex-1">
              <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest">Yeni Konşimento (BL) Takibi Başlat</label>
              <input type="text" value={newTrackNo} onChange={e=>setNewTrackNo(e.target.value)} className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white mt-2 outline-none uppercase font-bold tracking-widest" placeholder="Örn: MSC345678" />
            </div>
            <div className="w-48">
              <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest">Taşıyıcı</label>
              <select value={newCarrier} onChange={e=>setNewCarrier(e.target.value)} className="w-full bg-dark-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-white mt-2 outline-none">
                <option value="CMA CGM">CMA CGM</option>
                <option value="MSC">MSC</option>
                <option value="MAERSK">MAERSK</option>
              </select>
            </div>
            <button onClick={handleCreate} className="px-8 py-3.5 bg-white text-black font-extrabold rounded-xl hover:bg-zinc-200 transition uppercase tracking-wider text-xs">
              Sevkiyat Aç
            </button>
          </div>

          {trackings.map(t => <AdminTrackingRow key={t.tracking_no} tracking={t} />)}
        </div>
      );
    }
    
    function AdminTrackingRow({ tracking }) {
      const [vessel, setVessel] = useState(tracking.vessel_name);
      const [stage, setStage] = useState(tracking.current_stage);
      const [evLoc, setEvLoc] = useState('');
      const [evMsg, setEvMsg] = useState('');

      const quickStageChips = [
        { id: 'loading', label: '⚓ Yükleme' },
        { id: 'transit', label: '🌊 Transit' },
        { id: 'discharging', label: '🏗 Tahliye' },
        { id: 'completed', label: '✅ Teslim' }
      ];

      const handleUpdate = async (newStage = stage, customMsg = evMsg) => {
        await API.updateTracking({ 
          tracking_no: tracking.tracking_no, 
          vessel_name: vessel, 
          current_stage: newStage, 
          event_location: evLoc || 'Liman Terminali', 
          event_message: customMsg || `Durum güncellendi: ${newStage.toUpperCase()}`
        });
        setEvLoc(''); setEvMsg(''); alert('Canlı Takip Güncellendi!');
      };

      return (
        <div className="glass-panel p-6 rounded-3xl border border-white/10 space-y-6">
          <div className="flex justify-between items-center border-b border-white/10 pb-4">
            <div className="flex items-center space-x-4">
              <span className="text-2xl font-extrabold text-white tracking-widest font-mono">{tracking.tracking_no}</span>
              <span className="text-xs text-zinc-400 font-bold uppercase bg-dark-900 px-3 py-1 rounded-full border border-white/10">{tracking.carrier}</span>
            </div>

            {/* Quick Status Chips (Tek Tıkla Güncelleme) */}
            <div className="flex items-center space-x-2">
              <span className="text-[10px] text-zinc-500 font-bold uppercase tracking-wider mr-2">Hızlı Durum:</span>
              {quickStageChips.map(chip => (
                <button 
                  key={chip.id}
                  onClick={() => { setStage(chip.id); handleUpdate(chip.id, `Konteyner adımı güncellendi: ${chip.label}`); }}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${tracking.current_stage === chip.id ? 'bg-brand text-white shadow-lg shadow-brand/20' : 'bg-dark-900 text-zinc-400 hover:text-white border border-white/10'}`}
                >
                  {chip.label}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
              <label className="text-[10px] text-zinc-400 font-bold uppercase">Gemi Adı (Vessel)</label>
              <input type="text" value={vessel} onChange={e=>setVessel(e.target.value)} className="w-full bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mt-1 outline-none" />
            </div>
            <div>
              <label className="text-[10px] text-zinc-400 font-bold uppercase">Olay Konumu</label>
              <input type="text" value={evLoc} onChange={e=>setEvLoc(e.target.value)} placeholder="Örn: Ambarlı Limanı" className="w-full bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mt-1 outline-none" />
            </div>
            <div>
              <label className="text-[10px] text-zinc-400 font-bold uppercase">Canlı Log Mesajı</label>
              <input type="text" value={evMsg} onChange={e=>setEvMsg(e.target.value)} placeholder="Örn: Gümrük denetimi tamamlandı" className="w-full bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mt-1 outline-none" />
            </div>
            <button onClick={() => handleUpdate()} className="px-6 py-2.5 bg-white text-black font-extrabold rounded-xl hover:bg-zinc-200 transition text-xs uppercase tracking-wider">
              Log Ekle & Push Et
            </button>
          </div>
        </div>
      );
    }

    function AdminRatesPanel({ rates }) {
      const [origin, setOrigin] = useState('');
      const [dest, setDest] = useState('');
      const [carrier, setCarrier] = useState('MSC');
      const [buyPrice, setBuyPrice] = useState('');
      const [markup, setMarkup] = useState('15');

      const handleAddRate = async (e) => {
        e.preventDefault();
        if(!origin || !dest || !buyPrice) return alert('Tüm alanları doldurun!');
        await API.addCarrierRate({ origin, destination: dest, carrier, buy_price: buyPrice, default_markup: markup });
        setOrigin(''); setDest(''); setBuyPrice(''); alert('Yeni Navlun Şablonu Kütüphaneye Eklendi!');
      };

      return (
        <div className="space-y-8">
          {/* Yeni Tarife Ekleme Formu */}
          <form onSubmit={handleAddRate} className="glass-panel p-6 rounded-3xl border border-white/10">
            <h3 className="text-sm font-bold text-white uppercase tracking-widest mb-4 pb-2 border-b border-white/10">
              📚 Navlun Kütüphanesine Yeni Armatör Fiyatı Ekle
            </h3>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
              <input type="text" placeholder="Çıkış Limanı" value={origin} onChange={e=>setOrigin(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" required />
              <input type="text" placeholder="Varış Limanı" value={dest} onChange={e=>setDest(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" required />
              <select value={carrier} onChange={e=>setCarrier(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none">
                <option value="MSC">MSC</option>
                <option value="MAERSK LINE">MAERSK LINE</option>
                <option value="CMA CGM">CMA CGM</option>
                <option value="DFDS Seaways">DFDS Seaways (Ro-Ro)</option>
                <option value="ARKAS Line">ARKAS Line (Bölgesel)</option>
                <option value="TURKON Line">TURKON Line (Ekspres)</option>
                <option value="MEDKON Lines">MEDKON Lines (Kabotaj)</option>
                <option value="GRIMALDI Lines">GRIMALDI Lines (Ro-Ro/Konteyner)</option>
                <option value="COSCO SHIPPING">COSCO SHIPPING</option>
                <option value="HAPAG-LLOYD">HAPAG-LLOYD</option>
              </select>
              <input type="number" placeholder="Alış Fiyatı ($)" value={buyPrice} onChange={e=>setBuyPrice(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none font-mono" required />
              <button type="submit" className="bg-white text-black font-extrabold rounded-xl text-xs py-2 uppercase hover:bg-zinc-200 transition">Kütüphaneye Ekle</button>
            </div>
          </form>

          {/* Mevcut Kütüphane Listesi */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {rates.map(r => (
              <div key={r.id} className="glass-panel p-5 rounded-2xl border border-white/10 flex justify-between items-center">
                <div>
                  <div className="text-white font-extrabold text-lg">{r.origin} ➔ {r.destination}</div>
                  <div className="text-xs text-sky-400 font-bold uppercase tracking-wider mt-1">{r.carrier} • {r.type}</div>
                </div>
                <div className="text-right font-mono">
                  <div className="text-xs text-zinc-400">Alış: ${r.buy_price}</div>
                  <div className="text-sm font-extrabold text-emerald-400">Marj: %{r.default_markup}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
