<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portscanner | Kurumsal Lojistik İstihbarat</title>
  <meta name="description" content="Portscanner - Küresel denizcilik ağını saniyeler içinde tarayın, spot fırsatları yakalayın ve navlun maliyetlerini karşılaştırın." />
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Portscanner | Dijital Navlun & Lojistik Portalı" />
  <meta property="og:description" content="Kapasitenizi optimize edin. En prestijli kurumsal denizcilik B2B navlun portalı." />
  <meta property="og:image" content="/portscanner-og.jpg" />
  <meta property="og:url" content="https://portscanner.com" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Portscanner | B2B Lojistik" />
  <meta name="twitter:description" content="Dijital navlun ve anlık rezervasyon sistemi ile lojistik maliyetlerinizi optimize edin." />
  <meta name="twitter:image" content="/portscanner-og.jpg" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#2563eb', // Royal Blue
            accent: '#38bdf8', 
            dark: {
              900: '#101d36', // Daha Açık & Zengin Kurumsal Lacivert
              850: '#142443',
              800: '#1a2e54', // Panel ve Kartlar
              750: '#223a69',
              700: '#2d4b85'  // Borderlar
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #101d36; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
    
    .hero-bg {
      background-image: linear-gradient(to bottom, rgba(7, 13, 24, 0.15), rgba(16, 29, 54, 0.75)), url('bg.webp');
      background-size: cover;
      background-position: center 25%;
    }
    
    .glass-panel {
      background: rgba(26, 46, 84, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }
    
    /* ULTRA LÜKS YARI-SAYDAM KRİSTAL CAM ARAMA KAPSÜLÜ + AMBİYANS PARILTI SCAN */
    .glass-input-ivory {
      position: relative;
      background: rgba(26, 46, 84, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.4s ease;
      overflow: hidden;
    }
    
    /* AMBİYANS PARILTI SCAN (ÇUBUK İÇİ KART PARILTI) */
    .glass-input-ivory::before {
      content: '';
      position: absolute;
      top: 0; left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.35), rgba(255, 255, 255, 0.4), transparent);
      transform: skewX(-25deg);
      animation: ambientRadarGlow 4.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes ambientRadarGlow {
      0% { left: -150%; opacity: 0.2; }
      50% { left: 200%; opacity: 0.9; }
      100% { left: 200%; opacity: 0.2; }
    }

    .glass-input-ivory:hover {
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.7), 0 0 45px rgba(56, 189, 248, 0.3);
    }

    /* TARAMA ESNASINDA İNPUTLARIN YUMUŞAKÇA KAYBOLMASI VE ÇUBUĞUN BOŞALMASI */
    .inputs-fade-out {
      opacity: 0;
      transform: translateY(-2px);
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .inputs-fade-in {
      opacity: 1;
      transform: translateY(0);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* GERÇEKÇİ SİNEMATİK DALGA (V-SHAPE WAKE TRAIL) */
    @keyframes wakeExpandFull {
      0% { width: 0px; opacity: 0; }
      10% { opacity: 1; }
      85% { opacity: 1; }
      100% { width: 680px; opacity: 0; }
    }
    .animate-wake-expand {
      animation: wakeExpandFull 3.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* BASİT VE KASMAYAN SİNE DALGASI */
    @keyframes slideWave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-200px); } /* 200px periyot */
    }
    
    @keyframes slideLeft {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-680px, 0, 0); }
    }
    
    .animate-ship-pure-cruise {
      animation: slideLeft 3.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform;
      clip-path: polygon(0% 40%, 12% 50%, 25% 50%, 25% 30%, 40% 30%, 40% 50%, 43% 50%, 43% 25%, 57% 25%, 57% 50%, 60% 50%, 60% 20%, 75% 20%, 75% 50%, 78% 50%, 78% 10%, 88% 10%, 88% 30%, 92% 30%, 92% 60%, 100% 60%, 95% 100%, 5% 100%);
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
    }

    @keyframes sweepShine {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Animasyonlar */
    .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .fade-up-1 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.1s; opacity: 0; }
    .fade-up-2 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.2s; opacity: 0; }
    .fade-up-3 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: 0.3s; opacity: 0; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Login Ekranı Marka Görseli Yavaş Zoom */
    @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.1); } }
    .animate-slow-zoom { animation: slowZoom 20s linear infinite alternate; }

    /* Float Label Inputlar */
    .float-input-container { position: relative; margin-top: 1.5rem; }
    .float-input {
      width: 100%; background: transparent; border: none; border-bottom: 2px solid #334155; 
      padding: 12px 0; color: white; font-size: 1rem; outline: none; transition: border-color 0.3s;
    }
    .float-input:focus { border-bottom-color: #2563eb; }
    .float-label {
      position: absolute; left: 0; top: 14px; color: #64748b; font-size: 1rem; font-weight: 500;
      transition: 0.3s ease all; pointer-events: none;
    }
    .float-input:focus ~ .float-label, .float-input:not(:placeholder-shown) ~ .float-label {
      top: -12px; font-size: 0.75rem; color: #2563eb; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    }

    /* Lüks Buton Efekti */
    .lux-button {
      position: relative; overflow: hidden;
      box-shadow: 0 10px 30px -10px rgba(255, 255, 255, 0.3);
    }
    .lux-button::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.8), transparent);
      transform: skewX(-20deg); transition: 0.5s;
    }
    .lux-button:hover::after { left: 150%; }

    /* Gerçekçi (Yaşayan) Radar Ping'i */
    @keyframes ping-slow { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
    .animate-ping-slow { animation: ping-slow 3s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes dataFlow { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
    .living-data { animation: dataFlow 4s ease-in-out infinite; }

    /* Lüks Ambient Glow & Grid */
    .bg-mesh-navy {
      background: radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.18) 0%, transparent 45%),
                  radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
                  #101d36;
    }

    .subtle-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    .shimmer-badge {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 100%);
      background-size: 200% 100%;
      animation: shimmer 4s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ICONS (SVG) ---
    const Icons = {
      Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
      Exchange: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>,
      Map: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>,
      Globe: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>,
      Shield: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
      CraneLogo: () => (
        <svg className="w-12 h-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          {/* Arka Plan Dairesi (Radar Ekranı Glow) */}
          <circle cx="50" cy="50" r="48" fill="url(#radarBg)" stroke="#1e3a8a" strokeWidth="1" />
          
          {/* Radar Dalgaları (Sarı/Altın) */}
          <path d="M75 25 A 35 35 0 0 1 75 75" fill="none" stroke="#eab308" strokeWidth="3" strokeLinecap="round" opacity="0.8" />
          <path d="M65 35 A 21 21 0 0 1 65 65" fill="none" stroke="#eab308" strokeWidth="3" strokeLinecap="round" opacity="0.6" />
          <path d="M55 45 A 7 7 0 0 1 55 55" fill="none" stroke="#eab308" strokeWidth="3" strokeLinecap="round" opacity="0.4" />
          
          {/* Lüks Konteyner Gemisi (Beyaz & Mavi) */}
          <path d="M15 65 L25 75 L65 75 L75 60 L75 55 L20 55 Z" fill="#0f172a" />
          <path d="M15 65 L25 75 L65 75 L75 60 L75 55 L20 55 Z" fill="url(#hullGradient)" />
          <path d="M25 55 L25 40 L35 40 L35 55 Z" fill="#e2e8f0" /> {/* Kaptan Köşkü */}
          <path d="M28 44 L35 44 L35 48 L28 48 Z" fill="#0284c7" /> {/* Cam */}
          
          {/* Konteyner İstifleri */}
          <rect x="40" y="45" width="8" height="10" fill="#f59e0b" rx="1" />
          <rect x="50" y="45" width="8" height="10" fill="#f59e0b" rx="1" />
          <rect x="60" y="45" width="8" height="10" fill="#0284c7" rx="1" />
          <rect x="40" y="33" width="8" height="10" fill="#0284c7" rx="1" />
          <rect x="50" y="33" width="8" height="10" fill="#f59e0b" rx="1" />

          {/* Okyanus Yansıması */}
          <path d="M10 80 Q 50 90, 90 80" fill="none" stroke="#38bdf8" strokeWidth="2" strokeLinecap="round" opacity="0.5" />

          <defs>
            <linearGradient id="radarBg" x1="0" y1="0" x2="100" y2="100">
              <stop offset="0%" stopColor="#1e3a8a" stopOpacity="0.4" />
              <stop offset="100%" stopColor="#0f172a" stopOpacity="0.9" />
            </linearGradient>
            <linearGradient id="hullGradient" x1="15" y1="55" x2="75" y2="75">
              <stop offset="0%" stopColor="#2563eb" />
              <stop offset="100%" stopColor="#1e40af" />
            </linearGradient>
          </defs>
        </svg>
      ),
      CargoShip: () => (
        <svg className="w-7 h-7 text-white" viewBox="0 0 64 64" fill="none" stroke="currentColor" strokeWidth="2.5">
          {/* Gövde / Hull */}
          <path d="M4 42 L12 56 L52 56 L60 42 Z" fill="#2563eb" stroke="#38bdf8" strokeWidth="2" strokeLinejoin="round"/>
          {/* Güverte / Bridge & Containers */}
          <rect x="14" y="32" width="10" height="10" fill="#38bdf8" stroke="white" strokeWidth="1.5" rx="1"/>
          <rect x="26" y="32" width="10" height="10" fill="#38bdf8" stroke="white" strokeWidth="1.5" rx="1"/>
          <rect x="38" y="32" width="10" height="10" fill="#38bdf8" stroke="white" strokeWidth="1.5" rx="1"/>
          <rect x="20" y="22" width="10" height="10" fill="#60a5fa" stroke="white" strokeWidth="1.5" rx="1"/>
          <rect x="32" y="22" width="10" height="10" fill="#60a5fa" stroke="white" strokeWidth="1.5" rx="1"/>
          {/* Kaptan Köşkü / Navigation Tower */}
          <path d="M48 20 L56 20 L56 42 L48 42 Z" fill="#1e40af" stroke="white" strokeWidth="1.5"/>
          <circle cx="52" cy="26" r="2" fill="#38bdf8"/>
          {/* Dalga yansımaları */}
          <path d="M2 58 Q 16 62, 32 58 T 62 58" stroke="#38bdf8" strokeWidth="2" fill="none"/>
        </svg>
      )
    };

    // --- ENTERPRISE BACKEND API CLIENT ---
    const API = {
      getToken() { return localStorage.getItem('ps_token'); },
      setToken(t) { localStorage.setItem('ps_token', t); },
      getHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.getToken()}` }; },

      async req(endpoint, method='GET', body=null) {
        const opts = { method, headers: this.getHeaders() };
        if(body) opts.body = JSON.stringify(body);
        const res = await fetch(endpoint, opts);
        const contentType = res.headers.get('content-type');
        
        if (!contentType || !contentType.includes('application/json')) {
          throw new Error('Arka plan sunucusu henüz hazır değil veya 404 yanıtı verdi. Lütfen sunucu loglarını kontrol edin.');
        }

        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'API Hatası');
        return data;
      },

      async login(email, password) { const data = await this.req('/api/auth/login', 'POST', {email, password}); this.setToken(data.token); return data.user; },
      async register(name, email, password) { const data = await this.req('/api/auth/register', 'POST', {name, email, password}); this.setToken(data.token); return data.user; },
      async getMe() { if(!this.getToken()) return null; try { const data = await this.req('/api/auth/me'); return data.user; } catch(e) { return null; } },
      async getDB() { return this.req('/api/requests'); },
      async createRequest(payload) { return this.req('/api/requests', 'POST', payload); },
      async submitQuote(req_id, quoteData) { return this.req('/api/quote', 'POST', {req_id, ...quoteData}); },
      async createTracking(payload) { return this.req('/api/tracking', 'POST', payload); },
      async updateTracking(payload) { return this.req('/api/tracking/event', 'PUT', payload); },
      async addCarrierRate(payload) { return this.req('/api/rates', 'POST', payload); },
      async updateSessionState(state) { return this.req('/api/user/session-state', 'POST', state); },
      subscribe(onUpdate) { return () => {}; }
    };

    function App() {
      const [view, setView] = useState('home'); 
      const [db, setDb] = useState({ requests: [], trackings: [] });
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      useEffect(() => {
        API.getMe()
          .then(u => { setUser(u); })
          .catch(() => { setUser(null); })
          .finally(() => { setAuthLoading(false); });
      }, []);

      useEffect(() => {
        if(!user) return; 
        API.getDB().then(data => { if(!Array.isArray(data)) setDb(data); });
        const unsub = API.subscribe(data => { if(!Array.isArray(data)) setDb(data); });
        return () => unsub();
      }, [user]);

      const handleProtectedNavigate = (targetView) => {
        if (!user && targetView !== 'home' && targetView !== 'network' && targetView !== 'login') {
          setView('login');
        } else if (targetView === 'admin' && user?.role !== 'admin') {
          alert('⚠ YETKİ HATASI: Operasyon Masası yalnızca Sistem Yöneticisi (Admin) yetkisine sahip kurumsal hesaplar içindir.');
          setView('customer_portal');
        } else {
          setView(targetView);
        }
      };

      if(authLoading) return <div className="min-h-screen bg-dark-900 flex items-center justify-center text-white">Yükleniyor...</div>;

      return (
        <div className="min-h-screen flex flex-col">
          <Navbar view={view} setView={handleProtectedNavigate} user={user} setUser={setUser} requests={db.requests || []} />
          <main className="flex-1 relative">
            {view === 'home' && <HomeView requests={db?.requests || []} onScan={() => handleProtectedNavigate('results')} user={user} />}
            {view === 'login' && <AuthView setUser={setUser} setView={setView} />}
            {view === 'customer_portal' && <CustomerPortalView requests={db?.requests || []} setView={setView} user={user} />}
            {view === 'exchange' && <ExchangeView />}
            {view === 'tracking' && <LiveTrackingView trackings={db?.trackings || []} />}
            {view === 'network' && <NetworkView />}
            {view === 'admin' && (user?.role === 'admin' ? <AdminView db={db || {}} /> : <CustomerPortalView requests={db?.requests || []} setView={setView} user={user} />)}
            {!['home', 'login', 'customer_portal', 'exchange', 'tracking', 'network', 'admin'].includes(view) && <HomeView requests={db?.requests || []} onScan={() => handleProtectedNavigate('results')} user={user} />}
          </main>
        </div>
      );
    }

    function Navbar({ view, setView, user, setUser, requests }) {
      const userRequestCount = requests.length;

      const navItem = (id, label, Icon) => {
        const isActive = view === id;
        return (
          <button 
            onClick={() => setView(id)}
            className={`flex items-center space-x-2 px-4 py-2.5 rounded-full text-sm font-semibold transition ${isActive ? 'bg-white text-black' : 'text-zinc-400 hover:text-white'}`}
          >
            <Icon />
            <span>{label}</span>
          </button>
        );
      };

      return (
        <header className="border-b border-white/5 bg-dark-900/80 backdrop-blur-md sticky top-0 z-50">
          <div className="w-full px-6 h-20 flex items-center justify-between">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
              <Icons.CraneLogo />
              <span className="font-extrabold text-xl tracking-widest text-white uppercase">PORTSCANNER</span>
            </div>

            <nav className="hidden md:flex items-center space-x-1">
              {navItem('home', 'Arama', Icons.Search)}
              {user && navItem('customer_portal', 'Taleplerim & Navlun Portalı', Icons.User)}
              {user?.role === 'admin' && navItem('admin', 'Operasyon Masası (Admin)', Icons.Shield)}
              {navItem('exchange', 'Kapasite Borsası', Icons.Exchange)}
              {navItem('tracking', 'Canlı Takip', Icons.Map)}
              {navItem('network', 'Taşıyıcı Ağımız', Icons.Globe)}
            </nav>

            <div className="flex items-center space-x-5">
              {user?.role === 'admin' && (
                <button 
                  onClick={() => setView('admin')} 
                  className="px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-bold text-xs hover:bg-emerald-500/20 transition flex items-center gap-1.5"
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  <span>Ops Masası (Admin)</span>
                </button>
              )}
              
              {!user ? (

    function HomeView({ requests, onScan, user }) {
      const [type, setType] = useState('Konteyner');
      const [origin, setOrigin] = useState('');
      const [dest, setDest] = useState('');
      const [loading, setLoading] = useState(false);
      const [showRfqModal, setShowRfqModal] = useState(false);
      const [sortBy, setSortBy] = useState('recommended'); // 'recommended', 'cheapest', 'fastest', 'green'
      const [filterDirectOnly, setFilterDirectOnly] = useState(false);
      const [viewMode, setViewMode] = useState('list'); // 'list' | 'matrix'
      
      const [activeRequestId, setActiveRequestId] = useState(null);
      const resultsRef = useRef(null);

      // Kullanıcının Son Aramasını ve Oturum State'ini Yükle
      useEffect(() => {
        if (!user) return;
        // 1. Veritabanı / User profilinden gelen son state veya localStorage
        const savedState = user.last_search_state || JSON.parse(localStorage.getItem('ps_last_search_state') || '{}');
        if (savedState.origin) setOrigin(savedState.origin);
        if (savedState.destination) setDest(savedState.destination);
        if (savedState.cargo_type) setType(savedState.cargo_type);
        if (savedState.sort_by) setSortBy(savedState.sort_by);
        if (savedState.activeRequestId && requests.some(r => r.id === savedState.activeRequestId)) {
          setActiveRequestId(savedState.activeRequestId);
        } else if (requests.length > 0) {
          // Otomatik en son talebi seç (Geçmiş kaybolmaz!)
          setActiveRequestId(requests[0].id);
        }
      }, [user, requests.length]);

      // State değiştiğinde backend'e ve localStorage'a senkronize et
      const saveState = (newState) => {
        localStorage.setItem('ps_last_search_state', JSON.stringify(newState));
        if (user) API.updateSessionState(newState).catch(()=>{});
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if(!user) { onScan(); return; }

        setLoading(true); setActiveRequestId(null);
        setTimeout(async () => {
          try {
            const req = await API.createRequest({ cargo_type: type, amount: '1', origin, destination: dest, laycan_date: '' });
            setActiveRequestId(req.id); setLoading(false);
            
            const newState = { origin, destination: dest, cargo_type: type, sort_by: sortBy, activeRequestId: req.id };
            saveState(newState);

            setTimeout(() => { if (resultsRef.current) resultsRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
          } catch(err) { setLoading(false); alert('Hata: ' + err.message); }
        }, 3200); 
      };

      const activeRequest = requests.find(r => r.id === activeRequestId);

      // SIFIR HATA CANLI SIRALAMA VE FİLTRE MOTORU
      const getProcessedQuotes = () => {
        if (!activeRequest || !activeRequest.quotes) return [];
        let list = [...activeRequest.quotes];

        if (filterDirectOnly) {
          list = list.filter(q => q.type === 'Direkt');
        }

        if (sortBy === 'cheapest') {
          list.sort((a, b) => a.price - b.price);
        } else if (sortBy === 'fastest') {
          list.sort((a, b) => (a.transit_days || 99) - (b.transit_days || 99));
        } else if (sortBy === 'green') {
          list.sort((a, b) => (a.is_recommended ? -1 : 1));
        } else {
          // 'recommended'
          list.sort((a, b) => (b.is_recommended ? 1 : 0) - (a.is_recommended ? 1 : 0) || a.price - b.price);
        }

        return list;
      };

      const processedQuotes = getProcessedQuotes();

    // TOPLAM İTHALAT MALİYET HESAPLAYICI (LANDED COST ENGINE MODAL)
    function LandedCostModal({ quote, origin, destination, onClose }) {
      const [goodsValue, setGoodsValue] = useState(25000);
      const [quantity, setQuantity] = useState(5000);
      const [hsDutyRate, setHsDutyRate] = useState(5);
      const [drayage, setDrayage] = useState(350);
      const [customsFee, setCustomsFee] = useState(180);

      const freightPrice = Number(quote?.price) || 2000;
      const insurance = Math.round(goodsValue * 0.0015);
      const cifValue = goodsValue + freightPrice + insurance;
      
      const dutyAmount = Math.round(cifValue * (hsDutyRate / 100));
      const localPortFees = 220 + 150 + 45;
      const totalLandedCost = cifValue + dutyAmount + localPortFees + drayage + customsFee;
      const unitLandedCost = quantity > 0 ? (totalLandedCost / quantity).toFixed(2) : '0.00';

      return ReactDOM.createPortal(
        <div className="fixed inset-0 z-[99999] bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 overflow-y-auto fade-in">

              </div>
              <h3 className="text-2xl font-extrabold text-white font-sans mt-2">Toplam İthalat Maliyeti & Birim Fiyat Analizi</h3>
              <p className="text-xs text-zinc-400">{quote?.carrier} • {origin} ➔ {destination}</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-sans">
              <div className="space-y-1">
                <label className="block text-[11px] font-bold text-zinc-400 uppercase">Ticari Mal Faturası (FOB $):</label>
                <input type="number" value={goodsValue} onChange={e=>setGoodsValue(Number(e.target.value))} className="w-full bg-dark-900 border border-white/10 p-2.5 rounded-xl text-white font-mono outline-none" />
              </div>
              <div className="space-y-1">
                <label className="block text-[11px] font-bold text-zinc-400 uppercase">Ürün Adedi / Miktarı:</label>
                <input type="number" value={quantity} onChange={e=>setQuantity(Number(e.target.value))} className="w-full bg-dark-900 border border-white/10 p-2.5 rounded-xl text-white font-mono outline-none" />
              </div>
              <div className="space-y-1">
                <label className="block text-[11px] font-bold text-zinc-400 uppercase">GTİP Gümrük Vergisi (%):</label>
                <input type="number" value={hsDutyRate} onChange={e=>setHsDutyRate(Number(e.target.value))} className="w-full bg-dark-900 border border-white/10 p-2.5 rounded-xl text-white font-mono outline-none" />
              </div>
              <div className="space-y-1">
                <label className="block text-[11px] font-bold text-zinc-400 uppercase">İç Taşıma Kamyon Ücreti ($):</label>
                <input type="number" value={drayage} onChange={e=>setDrayage(Number(e.target.value))} className="w-full bg-dark-900 border border-white/10 p-2.5 rounded-xl text-white font-mono outline-none" />
              </div>
            </div>

            <div className="p-5 bg-dark-900 rounded-2xl border border-white/10 space-y-2.5 text-xs font-mono">
              <div className="flex justify-between border-b border-white/5 pb-1.5">
                <span className="text-zinc-400">Mal Bedeli (FOB):</span>
                <span className="text-white font-bold">${goodsValue.toLocaleString()}</span>
              </div>
              <div className="flex justify-between border-b border-white/5 pb-1.5">
                <span className="text-zinc-400">Okyanus Navlunu + Sigorta (CIF):</span>
                <span className="text-sky-300 font-bold">${cifValue.toLocaleString()}</span>
              </div>
              <div className="flex justify-between border-b border-white/5 pb-1.5">
                <span className="text-zinc-400">Tahmini Gümrük Vergisi (%{hsDutyRate}):</span>
                <span className="text-amber-400 font-bold">${dutyAmount.toLocaleString()}</span>
              </div>

    // LIVE TRACKING 
    function LiveTrackingView({ trackings }) {
      const [trackingNo, setTrackingNo] = useState('');
      const [searched, setSearched] = useState(false);
      const [liveLat, setLiveLat] = useState(40.7128);
      const [liveLon, setLiveLon] = useState(28.9784);
      const [secondsLeft, setSecondsLeft] = useState(310462); // ~3g 14s 14d 22sn

      // Live AIS Satellite Coordinate Drift & Real-Time Second Ticking Counter
      useEffect(() => {
        if (!searched) return;
        
        // 1. Ticking Countdown Clock (Her saniye düşer)
        const clockInterval = setInterval(() => {
          setSecondsLeft(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);

        // 2. AIS Live Coordinate Drift (Her 3 saniyede koordinat kayar)
        const aisInterval = setInterval(() => {
          setLiveLat(prev => prev + (Math.random() * 0.0002 - 0.0001));
          setLiveLon(prev => prev + (Math.random() * 0.0002 - 0.0001));
        }, 3000);

        return () => {
          clearInterval(clockInterval);
          clearInterval(aisInterval);
        };
      }, [searched]);

      const formatTimeLeft = (totalSec) => {
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400) / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        return `${String(days).padStart(2, '0')}d ${String(hours).padStart(2, '0')}h ${String(mins).padStart(2, '0')}m ${String(secs).padStart(2, '0')}s`;
      };

      const handleTrack = (e) => { e.preventDefault(); setSearched(true); };
      const result = searched ? trackings.find(t => t.tracking_no === trackingNo.toUpperCase()) : null;
      const stages = ['YÜKLEME (POL)', 'TRANSİT (SEA)', 'TAHLİYE (POD)', 'TESLİM (DOOR)'];
      const getStageIndex = (stage) => {
        if (!stage) return 1;
        const lower = stage.toLowerCase();
        if (lower.includes('yük') || lower.includes('pol') || lower.includes('loading')) return 0;
        if (lower.includes('trans') || lower.includes('sea')) return 1;
        if (lower.includes('tahli') || lower.includes('pod') || lower.includes('discharg')) return 2;
        if (lower.includes('teslim') || lower.includes('door') || lower.includes('complet')) return 3;
        return 1;
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-16 fade-in">
          <form onSubmit={handleTrack} className="flex gap-4 mb-10 max-w-2xl mx-auto">
            <input

              TELEMETRİ SORGULA ➔
            </button>
          </form>

          {searched && !result && (
            <div className="text-center p-16 glass-panel border border-white/10 rounded-3xl text-zinc-400 font-mono text-xs">
              <span className="text-amber-400 font-bold block text-sm mb-1">⚠ KAYIT BULUNAMADI</span>
              Girilen konşimento numarası ile eşleşen canlı AIS telemetri kaydı bulunamadı.
            </div>
          )}

          {searched && result && (
            <div className="glass-panel p-8 lg:p-12 rounded-3xl border border-white/15 space-y-10 shadow-2xl">
              
              {/* ÜST BİLGİ VE TELEMETRİ DURUM ROZETİ */}
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-white/10">

    function AdminQuoteRow({ req, carrierRates }) {
      const [carrier, setCarrier] = useState('MSC');
      const [buyPrice, setBuyPrice] = useState('1800');
      const [markupPercent, setMarkupPercent] = useState(15);
      const [transit, setTransit] = useState('5');
      const [type, setType] = useState('Direkt');
      const [isRec, setIsRec] = useState(true);

      // Auto-suggest matching rate from library
      const matchedRate = carrierRates.find(r => 
        r.origin.toLowerCase() === req.origin.toLowerCase() && 
        r.destination.toLowerCase() === req.destination.toLowerCase()
      );

      const applyTemplate = (r) => {
        setCarrier(r.carrier);
        setBuyPrice(r.buy_price.toString());
        setMarkupPercent(r.default_markup || 15);
        setTransit(r.transit_days.toString());
        setType(r.type || 'Direkt');
      };

      const calculatedBuy = Number(buyPrice) || 0;
      const calculatedProfit = Math.round(calculatedBuy * (Number(markupPercent) / 100));
      const calculatedSellPrice = calculatedBuy + calculatedProfit;

      const handleQuote = async () => {
        if(!calculatedSellPrice) return alert('Lütfen geçerli bir alış fiyatı giriniz!');
        await API.submitQuote(req.id, { 
          carrier, 
          price: calculatedSellPrice, 
          buy_price: calculatedBuy,
          type, 
          transit_days: Number(transit), 
          is_recommended: isRec 
        });
        alert(`Teklif Gönderildi! Otomatik BL Kartı Açıldı. Net Karınız: +$${calculatedProfit}`);
      };

      return (
        <div className="glass-panel p-6 lg:p-8 rounded-3xl flex flex-col lg:flex-row justify-between gap-8 border border-white/10 hover:border-brand/30 transition">

          tracking_no: tracking.tracking_no, 
          vessel_name: vessel, 
          current_stage: newStage, 
          event_location: evLoc || 'Liman Terminali', 
          event_message: customMsg || `Durum güncellendi: ${newStage.toUpperCase()}`
        });
        setEvLoc(''); setEvMsg(''); alert('Canlı Takip Güncellendi!');
      };

      return (
        <div className="glass-panel p-6 rounded-3xl border border-white/10 space-y-6">
          <div className="flex justify-between items-center border-b border-white/10 pb-4">
            <div className="flex items-center space-x-4">
              <span className="text-2xl font-extrabold text-white tracking-widest font-mono">{tracking.tracking_no}</span>
              <span className="text-xs text-zinc-400 font-bold uppercase bg-dark-900 px-3 py-1 rounded-full border border-white/10">{tracking.carrier}</span>
            </div>

            {/* Quick Status Chips (Tek Tıkla Güncelleme) */}
            <div className="flex items-center space-x-2">
              <span className="text-[10px] text-zinc-500 font-bold uppercase tracking-wider mr-2">Hızlı Durum:</span>
              {quickStageChips.map(chip => (
                <button 
                  key={chip.id}
                  onClick={() => { setStage(chip.id); handleUpdate(chip.id, `Konteyner adımı güncellendi: ${chip.label}`); }}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${tracking.current_stage === chip.id ? 'bg-brand text-white shadow-lg shadow-brand/20' : 'bg-dark-900 text-zinc-400 hover:text-white border border-white/10'}`}
                >
                  {chip.label}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
              <label className="text-[10px] text-zinc-400 font-bold uppercase">Gemi Adı (Vessel)</label>
              <input type="text" value={vessel} onChange={e=>setVessel(e.target.value)} className="w-full bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mt-1 outline-none" />
            </div>
            <div>
              <label className="text-[10px] text-zinc-400 font-bold uppercase">Olay Konumu</label>
              <input type="text" value={evLoc} onChange={e=>setEvLoc(e.target.value)} placeholder="Örn: Ambarlı Limanı" className="w-full bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mt-1 outline-none" />
            </div>
            <div>
              <label className="text-[10px] text-zinc-400 font-bold uppercase">Canlı Log Mesajı</label>
              <input type="text" value={evMsg} onChange={e=>setEvMsg(e.target.value)} placeholder="Örn: Gümrük denetimi tamamlandı" className="w-full bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mt-1 outline-none" />
            </div>
            <button onClick={() => handleUpdate()} className="px-6 py-2.5 bg-white text-black font-extrabold rounded-xl hover:bg-zinc-200 transition text-xs uppercase tracking-wider">
              Log Ekle & Push Et
            </button>
          </div>
        </div>
      );
    }

    function AdminRatesPanel({ rates }) {
      const [origin, setOrigin] = useState('');
      const [dest, setDest] = useState('');
      const [carrier, setCarrier] = useState('MSC');
      const [buyPrice, setBuyPrice] = useState('');
      const [markup, setMarkup] = useState('15');

      const handleAddRate = async (e) => {
        e.preventDefault();
        if(!origin || !dest || !buyPrice) return alert('Tüm alanları doldurun!');
        await API.addCarrierRate({ origin, destination: dest, carrier, buy_price: buyPrice, default_markup: markup });
        setOrigin(''); setDest(''); setBuyPrice(''); alert('Yeni Navlun Şablonu Kütüphaneye Eklendi!');
      };

      return (
        <div className="space-y-8">
          {/* Yeni Tarife Ekleme Formu */}
          <form onSubmit={handleAddRate} className="glass-panel p-6 rounded-3xl border border-white/10">
            <h3 className="text-sm font-bold text-white uppercase tracking-widest mb-4 pb-2 border-b border-white/10">
              📚 Navlun Kütüphanesine Yeni Armatör Fiyatı Ekle
            </h3>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
              <input type="text" placeholder="Çıkış Limanı" value={origin} onChange={e=>setOrigin(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" required />
              <input type="text" placeholder="Varış Limanı" value={dest} onChange={e=>setDest(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" required />
              <select value={carrier} onChange={e=>setCarrier(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none">
                <option value="MSC">MSC</option>
                <option value="MAERSK LINE">MAERSK LINE</option>
                <option value="CMA CGM">CMA CGM</option>
                <option value="DFDS Seaways">DFDS Seaways (Ro-Ro)</option>
                <option value="ARKAS Line">ARKAS Line (Bölgesel)</option>
                <option value="TURKON Line">TURKON Line (Ekspres)</option>
                <option value="MEDKON Lines">MEDKON Lines (Kabotaj)</option>
                <option value="GRIMALDI Lines">GRIMALDI Lines (Ro-Ro/Konteyner)</option>
                <option value="COSCO SHIPPING">COSCO SHIPPING</option>
                <option value="HAPAG-LLOYD">HAPAG-LLOYD</option>
              </select>
              <input type="number" placeholder="Alış Fiyatı ($)" value={buyPrice} onChange={e=>setBuyPrice(e.target.value)} className="bg-dark-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none font-mono" required />
              <button type="submit" className="bg-white text-black font-extrabold rounded-xl text-xs py-2 uppercase hover:bg-zinc-200 transition">Kütüphaneye Ekle</button>
            </div>
          </form>

          {/* Mevcut Kütüphane Listesi */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {rates.map(r => (
              <div key={r.id} className="glass-panel p-5 rounded-2xl border border-white/10 flex justify-between items-center">
                <div>
                  <div className="text-white font-extrabold text-lg">{r.origin} ➔ {r.destination}</div>
                  <div className="text-xs text-sky-400 font-bold uppercase tracking-wider mt-1">{r.carrier} • {r.type}</div>
                </div>
                <div className="text-right font-mono">
                  <div className="text-xs text-zinc-400">Alış: ${r.buy_price}</div>
                  <div className="text-sm font-extrabold text-emerald-400">Marj: %{r.default_markup}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
